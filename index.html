<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обезличивание документов — Эксойл Групп</title>
<style>
  :root{
    --bg:#f6f5f3; --card:#ffffff; --text:#1c1f23; --muted:#6b7485;
    --border:#e6e1da;
    --brand:#b45309;         /* тёмно-оранжевый */
    --brand-h:#92400e;
    --brand-soft:rgba(180,83,9,.10);
    --green:#1f9d55; --green-h:#178347;
    --err:#c0233b;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#15130f; --card:#1e1b17; --text:#ece7e1; --muted:#a49a8d;
          --border:#33302a;
          --brand:#e08a3c; --brand-h:#f0a55a; --brand-soft:rgba(224,138,60,.14);
          --green:#2bbd6a; --green-h:#25a75c; --err:#ff6b81;
          --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
  main{max-width:760px;width:100%}

  .brand{text-align:center;margin:0 0 6px;font-size:26px;font-weight:800;
         letter-spacing:.02em;color:var(--brand)}
  h1{font-size:17px;margin:0 0 24px;font-weight:500;color:var(--muted);text-align:center}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
        padding:22px;margin:0 0 16px;box-shadow:var(--shadow)}
  .step{margin-bottom:10px;font-size:15px;font-weight:650}
  .step .num{display:inline-flex;width:24px;height:24px;border-radius:50%;
             align-items:center;justify-content:center;margin-right:8px;
             background:var(--brand);color:#fff;font-size:13px;font-weight:700}

  .drop{border:2px dashed var(--border);border-radius:12px;padding:26px 18px;text-align:center;
        cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
  .drop .title{font-weight:600;margin-bottom:4px}
  .drop .hint{color:var(--muted);font-size:13px}
  .drop.has-file{border-color:var(--green);border-style:solid;
                 background:color-mix(in srgb,var(--green) 7%,transparent)}
  .drop .fname{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--green);
               word-break:break-all}

  button{font:inherit;font-weight:600;border-radius:10px;cursor:pointer;border:1px solid transparent;
         padding:11px 18px;transition:background .15s,transform .05s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--brand-h)}
  .btn-download{display:flex;align-items:center;justify-content:center;gap:10px;
                width:100%;padding:16px 20px;font-size:16px;font-weight:700;
                background:var(--green);color:#fff;border-radius:12px;text-decoration:none}
  .btn-download:hover{background:var(--green-h)}
  .btn-download svg{flex:none}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .row .grow{flex:1 1 200px}
  .link-btn{background:transparent;color:var(--muted);border:none;font-weight:500;font-size:13px;
            padding:6px 0;cursor:pointer}
  .link-btn:hover{color:var(--brand);text-decoration:underline}

  .progress-wrap{margin-top:16px}
  .progress{height:8px;border-radius:999px;background:color-mix(in srgb,var(--muted) 18%,transparent);
            overflow:hidden;position:relative}
  .progress .bar{height:100%;width:0%;border-radius:999px;background:var(--brand);
                 transition:width .35s ease}
  .progress .bar.indeterminate{width:35%!important;position:absolute;left:0;
                 animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{left:-35%}100%{left:100%}}
  .progress-text{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}

  .status{font-size:13.5px;min-height:18px}
  .status.err{color:var(--err)}
  .status.ok{color:var(--green)}

  .files-table{font-size:13px}
  .files-table td,.files-table th{padding:8px 10px;vertical-align:middle}
  .files-table .fname{font-weight:600;word-break:break-all}
  .files-table .muted{color:var(--muted);white-space:nowrap}
  .status-pill{display:inline-block;padding:3px 9px;border-radius:999px;
               font-size:12px;font-weight:600;white-space:nowrap}
  .status-pending{background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted)}
  .status-processing{background:var(--brand-soft);color:var(--brand)}
  .status-done{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
  .status-error{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
  .prog{--p:0;width:46px;height:46px;border-radius:50%;flex:none;
        background:conic-gradient(var(--brand) calc(var(--p)*1%), var(--border) 0);
        display:flex;align-items:center;justify-content:center;transition:background .25s}
  .prog span{width:36px;height:36px;border-radius:50%;background:var(--card);
             display:flex;align-items:center;justify-content:center;
             font-size:11px;font-weight:700;color:var(--text)}
  .prog.err{background:conic-gradient(var(--err) calc(var(--p)*1%), var(--border) 0)}
  .file-error{display:block;font-size:11.5px;color:var(--err);margin-top:2px;font-weight:400}
  .file-note{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
  .btn-row{font-size:12.5px;padding:7px 12px;border-radius:8px;white-space:nowrap}
  .btn-row-dl{background:var(--green);color:#fff}
  .btn-row-dl:hover:not(:disabled){background:var(--green-h)}

  .hidden{display:none!important}

  .login-actions{display:flex;justify-content:flex-end;margin-top:14px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;padding:11px 13px;font:inherit;
        border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}
  input:focus{outline:none;border-color:var(--brand);
              box-shadow:0 0 0 3px var(--brand-soft)}

  .preview{margin-top:14px}
  .preview-toggle{background:transparent;border:none;color:var(--brand);font-weight:600;
                  font-size:13.5px;cursor:pointer;padding:6px 0}
  .preview-toggle:hover{text-decoration:underline}
  .preview-body{margin-top:8px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;border-radius:8px;overflow:hidden}
  td,th{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:color-mix(in srgb,var(--muted) 10%,transparent);font-weight:600}
  pre{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--muted) 8%,transparent);
      padding:12px;border-radius:8px;max-height:340px;overflow:auto;font-size:12.5px;margin:0}

  footer{margin-top:auto;padding:28px 0 8px;font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<main>
  <div class="brand">Эксойл Групп</div>
  <h1>Обезличивание документов</h1>

  <!-- Вход -->
  <section id="loginBox" class="card">
    <label class="field"><span>Логин</span>
      <input id="login" type="text" autocomplete="username">
    </label>
    <label class="field"><span>Пароль</span>
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <div id="loginMsg" class="status err"></div>
    <div class="login-actions">
      <button id="loginBtn" class="btn-primary">Войти</button>
    </div>
  </section>

  <!-- Приложение -->
  <section id="app" class="hidden">

    <!-- Шаг 1: загрузка -->
    <div class="card">
      <div class="step"><span class="num">1</span>Загрузить файлы</div>

      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Выбрать файлы">
        <div class="title">Выберите файлы или перетащите сюда</div>
        <div class="hint">PDF или Excel (.xlsx) — можно несколько файлов сразу</div>
        <div id="fname" class="fname hidden"></div>
        <input id="file" type="file" accept=".pdf,.xlsx" multiple class="hidden">
      </div>

      <div class="row">
        <button id="btn" class="btn-primary grow" disabled>Обработать все</button>
        <button id="logout" class="link-btn" type="button">Выйти</button>
      </div>

      <div id="status" class="status" style="margin-top:10px"></div>
    </div>

    <!-- Шаг 2: таблица файлов и скачивание по мере готовности -->
    <div id="result" class="card hidden">
      <div class="step"><span class="num">2</span>Файлы</div>

      <div style="overflow-x:auto">
        <table class="files-table">
          <thead>
            <tr>
              <th>Файл</th>
              <th>Размер</th>
              <th>Статус</th>
              <th>Прогресс</th>
              <th>Время</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="filesBody"></tbody>
        </table>
      </div>

      <div id="summary" class="status" style="margin-top:10px"></div>

      <div class="preview">
        <button id="previewToggle" class="preview-toggle hidden" type="button">Показать предпросмотр последнего файла</button>
        <div id="previewBody" class="preview-body hidden"></div>
      </div>
    </div>

  </section>
</main>

<footer>Разработано Жданкиным А.А.</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);

let creds = null;
try { creds = JSON.parse(sessionStorage.getItem("creds") || "null"); } catch { creds = null; }

function headers() { return creds ? { "X-Login": creds.login, "X-Password": creds.password } : {}; }

function showLogin() {
  $("app").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
}
function showApp() {
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
}
function logout() {
  creds = null;
  sessionStorage.removeItem("creds");
  showLogin();
  resetUpload();
}
function resetUpload() {
  for (const item of queue) if (item.timer) clearInterval(item.timer);
  queue = [];
  $("file").value = "";
  $("filesBody").textContent = "";
  $("fname").classList.add("hidden");
  $("fname").textContent = "";
  $("drop").classList.remove("has-file");
  $("btn").disabled = true;
  $("result").classList.add("hidden");
  $("summary").textContent = "";
  $("previewBody").textContent = "";
  $("previewBody").classList.add("hidden");
  $("previewToggle").classList.add("hidden");
  setStatus("", "");
}

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text || "";
  el.className = "status" + (kind ? " " + kind : "");
}

async function login() {
  const login = $("login").value.trim();
  const password = $("password").value;
  if (!login || !password) { $("loginMsg").textContent = "Введите логин и пароль"; return; }
  $("loginBtn").disabled = true;
  $("loginMsg").textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login, password })
    });
    let d = {};
    try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.detail || "Неверный логин или пароль");
    creds = { login, password };
    sessionStorage.setItem("creds", JSON.stringify(creds));
    $("password").value = "";
    showApp();
  } catch (e) {
    $("loginMsg").textContent = e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
}

$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("login").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("logout").addEventListener("click", logout);

// ---------- выбор файлов ----------
let queue = [];
let processing = false;
let nextFileId = 1;

function pickFiles() { $("file").click(); }
$("drop").addEventListener("click", pickFiles);
$("drop").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFiles(); }
});
["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.add("over");
}));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.remove("over");
}));
$("drop").addEventListener("drop", e => addFiles(e.dataTransfer.files));
$("file").addEventListener("change", e => {
  addFiles(e.target.files);
  e.target.value = "";
});

function formatSize(bytes) {
  if (bytes == null) return "—";
  if (bytes < 1024) return bytes + " Б";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " КБ";
  return (bytes / (1024 * 1024)).toFixed(1) + " МБ";
}

function createRow(item) {
  const tr = document.createElement("tr");

  const nameTd = document.createElement("td");
  nameTd.className = "fname";
  nameTd.textContent = item.file.name;

  const sizeTd = document.createElement("td");
  sizeTd.className = "muted";
  sizeTd.textContent = formatSize(item.file.size);

  const statusTd = document.createElement("td");
  const progressTd = document.createElement("td");
  progressTd.innerHTML = '<div class="prog"><span>0%</span></div>';
  const timeTd = document.createElement("td");
  timeTd.className = "muted";
  const actionTd = document.createElement("td");

  tr.appendChild(nameTd);
  tr.appendChild(sizeTd);
  tr.appendChild(statusTd);
  tr.appendChild(progressTd);
  tr.appendChild(timeTd);
  tr.appendChild(actionTd);
  $("filesBody").appendChild(tr);

  item.pct = 0;
  item.timer = null;
  item.els = { status: statusTd, progress: progressTd, time: timeTd, action: actionTd };
  return tr;
}

function addFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;

  const skipped = [];
  let added = 0;
  for (const f of files) {
    const name = (f.name || "").toLowerCase();
    if (!name.endsWith(".pdf") && !name.endsWith(".xlsx")) { skipped.push(f.name); continue; }
    const dup = queue.some(q => q.file.name === f.name && q.file.size === f.size &&
                               q.file.lastModified === f.lastModified);
    if (dup) continue;
    const item = { id: nextFileId++, file: f, status: "pending", error: "",
                   note: "", elapsed: null, downloadUrl: "", downloadName: "" };
    createRow(item);
    queue.push(item);
    updateRow(item);
    added++;
  }

  if (skipped.length) {
    setStatus("Пропущены (нужен PDF или .xlsx): " + skipped.join(", "), "err");
  } else if (added) {
    setStatus("", "");
  }

  updateSelectedInfo();
  if (queue.length) $("result").classList.remove("hidden");
  updateSummary();
  updateButton();
}

function updateSelectedInfo() {
  const n = queue.length;
  if (!n) {
    $("fname").textContent = "";
    $("fname").classList.add("hidden");
    $("drop").classList.remove("has-file");
    return;
  }
  $("fname").textContent = n === 1 ? queue[0].file.name : "Выбрано файлов: " + n;
  $("fname").classList.remove("hidden");
  $("drop").classList.add("has-file");
}

function renderProgress(item, pct) {
  const el = item.els.progress.firstChild;
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  item.pct = p;
  el.style.setProperty("--p", p);
  el.firstChild.textContent = p + "%";
  el.classList.toggle("err", item.status === "error");
}

function updateRow(item) {
  const labels = {
    pending: ["В очереди", "status-pending"],
    processing: ["Обработка…", "status-processing"],
    done: ["Готово", "status-done"],
    error: ["Ошибка", "status-error"]
  };
  const [label, cls] = labels[item.status] || labels.pending;
  const statusTd = item.els.status;
  statusTd.textContent = "";
  const pill = document.createElement("span");
  pill.className = "status-pill " + cls;
  pill.textContent = label;
  statusTd.appendChild(pill);
  if (item.error) {
    const err = document.createElement("span");
    err.className = "file-error";
    err.textContent = item.error;
    statusTd.appendChild(err);
  } else if (item.note) {
    const note = document.createElement("span");
    note.className = "file-note";
    note.textContent = item.note;
    statusTd.appendChild(note);
  }

  item.els.time.textContent = item.elapsed != null ? item.elapsed + " с" : "—";

  renderProgress(item, item.status === "done" ? 100
                    : item.status === "processing" ? item.pct : 0);

  const actionTd = item.els.action;
  actionTd.textContent = "";
  const btn = document.createElement("button");
  btn.className = "btn-row";
  btn.type = "button";
  if (item.status === "done" && item.downloadUrl) {
    btn.classList.add("btn-row-dl");
    btn.textContent = "Скачать";
    btn.addEventListener("click", () => downloadFile(item.downloadUrl, item.downloadName));
  } else {
    btn.textContent = item.status === "processing" ? "Подождите" : "Скачать";
    btn.disabled = true;
  }
  actionTd.appendChild(btn);
}

function updateSummary() {
  const total = queue.length;
  if (!total) { $("summary").textContent = ""; return; }
  const done = queue.filter(q => q.status === "done").length;
  const errors = queue.filter(q => q.status === "error").length;
  const active = queue.filter(q => q.status === "processing").length;
  let text = "Готово " + done + " из " + total;
  if (errors) text += ", с ошибкой: " + errors;
  if (active) text += " — идёт обработка…";
  $("summary").textContent = text;
}

function updateButton() {
  $("btn").disabled = processing || !queue.some(q => q.status === "pending");
}

// ---------- обработка: строго по одному файлу ----------
$("btn").addEventListener("click", processAll);

async function processAll() {
  if (processing) return;
  if (!creds) { logout(); return; }
  if (!queue.some(q => q.status === "pending")) {
    setStatus("Добавьте файлы для обработки", "err");
    return;
  }

  processing = true;
  $("btn").disabled = true;
  setStatus("Файлы обрабатываются, ожидайте....", "");

  for (const item of queue) {
    if (!creds) break;
    if (item.status !== "pending") continue;
    await processOne(item);
    updateSummary();
  }

  processing = false;
  updateButton();
  updateSummary();
  if (!creds) return;
  const errors = queue.filter(q => q.status === "error").length;
  setStatus(errors ? "Обработка завершена, ошибок: " + errors
                   : "Все файлы готовы. Скачивайте по одному.",
            errors ? "err" : "ok");
}

async function processOne(item) {
  item.status = "processing";
  item.error = "";
  item.note = "";
  item.elapsed = null;
  updateRow(item);
  updateSummary();

  if (item.timer) clearInterval(item.timer);
  item.timer = setInterval(() => {
    if (item.pct < 95) {
      const step = Math.max(1, Math.round((95 - item.pct) * 0.08));
      renderProgress(item, Math.min(95, item.pct + step));
    }
  }, 400);

  const started = performance.now();
  try {
    const fd = new FormData();
    fd.append("file", item.file);
    const r = await fetch("/api/process", { method: "POST", headers: headers(), body: fd });
    let d = {};
    try { d = await r.json(); } catch {}
    if (r.status === 401) {
      logout();
      $("loginMsg").textContent = "Сессия истекла, войдите снова";
      return;
    }
    if (!r.ok) throw new Error(d.detail || "Не удалось обработать файл");
    item.status = "done";
    item.downloadUrl = d.download_url;
    item.downloadName = d.download_name || ("masked_" + item.file.name);
    item.elapsed = d.elapsed != null ? d.elapsed
                                     : Math.round((performance.now() - started) / 100) / 10;
    item.note = d.warning || (d.llm_error
      ? (d.llm_error === "disabled" ? "LLM отключена — использованы только правила"
                                    : "LLM недоступна — использованы только правила")
      : "");
    renderPreview(d, item.file.name);
  } catch (e) {
    item.status = "error";
    item.error = e.message;
  }
  if (item.timer) { clearInterval(item.timer); item.timer = null; }
  item.pct = item.status === "done" ? 100 : 0;
  updateRow(item);
}

async function downloadFile(url, name) {
  try {
    const r = await fetch(url, { headers: headers() });
    if (r.status === 401) { logout(); $("loginMsg").textContent = "Сессия истекла"; return; }
    if (!r.ok) throw new Error("Не удалось скачать файл");
    const blob = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objUrl;
    a.download = name || "masked";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 2000);
  } catch (e) {
    setStatus("Ошибка скачивания: " + e.message, "err");
  }
}

// ---------- предпросмотр последнего готового файла ----------
function renderPreview(d, filename) {
  const body = $("previewBody");
  const toggle = $("previewToggle");
  body.textContent = "";
  body.classList.add("hidden");
  toggle.classList.remove("hidden");
  toggle.textContent = "Показать предпросмотр" + (filename ? ": " + filename : "");

  if (d.preview_type === "excel" && Array.isArray(d.preview) && d.preview.length) {
    const t = document.createElement("table");
    d.preview.forEach((row, i) => {
      const tr = document.createElement("tr");
      (row || []).forEach(c => {
        const el = document.createElement(i === 0 ? "th" : "td");
        el.textContent = c == null ? "" : String(c);
        tr.appendChild(el);
      });
      t.appendChild(tr);
    });
    body.appendChild(t);
  } else {
    const pre = document.createElement("pre");
    pre.textContent = d.preview || "(текст не извлечён)";
    body.appendChild(pre);
  }

  toggle.onclick = () => {
    const hidden = body.classList.toggle("hidden");
    toggle.textContent = hidden
      ? "Показать предпросмотр" + (filename ? ": " + filename : "")
      : "Скрыть предпросмотр";
  };
}

// ---------- старт ----------
if (creds) {
  fetch("/api/me", { headers: headers() })
    .then(r => { if (r.ok) showApp(); else logout(); })
    .catch(() => logout());
} else {
  showLogin();
}
</script>
