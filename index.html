<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обезличивание документов — Эксойл Групп</title>
<style>
  :root{
    --bg:#f6f5f3; --card:#ffffff; --text:#1c1f23; --muted:#6b7485;
    --border:#e6e1da;
    --brand:#b45309;         /* тёмно-оранжевый */
    --brand-h:#92400e;
    --brand-soft:rgba(180,83,9,.10);
    --green:#1f9d55; --green-h:#178347;
    --err:#c0233b;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#15130f; --card:#1e1b17; --text:#ece7e1; --muted:#a49a8d;
          --border:#33302a;
          --brand:#e08a3c; --brand-h:#f0a55a; --brand-soft:rgba(224,138,60,.14);
          --green:#2bbd6a; --green-h:#25a75c; --err:#ff6b81;
          --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
  main{max-width:760px;width:100%}

  .brand{text-align:center;margin:0 0 6px;font-size:26px;font-weight:800;
         letter-spacing:.02em;color:var(--brand)}
  h1{font-size:17px;margin:0 0 24px;font-weight:500;color:var(--muted);text-align:center}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
        padding:22px;margin:0 0 16px;box-shadow:var(--shadow)}
  .step{margin-bottom:10px;font-size:15px;font-weight:650}
  .step .num{display:inline-flex;width:24px;height:24px;border-radius:50%;
             align-items:center;justify-content:center;margin-right:8px;
             background:var(--brand);color:#fff;font-size:13px;font-weight:700}

  .drop{border:2px dashed var(--border);border-radius:12px;padding:26px 18px;text-align:center;
        cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
  .drop .title{font-weight:600;margin-bottom:4px}
  .drop .hint{color:var(--muted);font-size:13px}
  .drop.has-file{border-color:var(--green);border-style:solid;
                 background:color-mix(in srgb,var(--green) 7%,transparent)}
  .drop .fname{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--green);
               word-break:break-all}

  button{font:inherit;font-weight:600;border-radius:10px;cursor:pointer;border:1px solid transparent;
         padding:11px 18px;transition:background .15s,transform .05s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--brand-h)}
  .btn-download{display:flex;align-items:center;justify-content:center;gap:10px;
                width:100%;padding:16px 20px;font-size:16px;font-weight:700;
                background:var(--green);color:#fff;border-radius:12px;text-decoration:none}
  .btn-download:hover{background:var(--green-h)}
  .btn-download svg{flex:none}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .row .grow{flex:1 1 200px}
  .link-btn{background:transparent;color:var(--muted);border:none;font-weight:500;font-size:13px;
            padding:6px 0;cursor:pointer}
  .link-btn:hover{color:var(--brand);text-decoration:underline}

  .progress-wrap{margin-top:16px}
  .progress{height:8px;border-radius:999px;background:color-mix(in srgb,var(--muted) 18%,transparent);
            overflow:hidden;position:relative}
  .progress .bar{height:100%;width:0%;border-radius:999px;background:var(--brand);
                 transition:width .35s ease}
  .progress .bar.indeterminate{width:35%!important;position:absolute;left:0;
                 animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{left:-35%}100%{left:100%}}
  .progress-text{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}

  .status{font-size:13.5px;min-height:18px}
  .status.err{color:var(--err)}
  .status.ok{color:var(--green)}

  .files-table{font-size:13px}
  .files-table td,.files-table th{padding:8px 10px;vertical-align:middle}
  .files-table .fname{font-weight:600;word-break:break-all}
  .files-table .muted{color:var(--muted);white-space:nowrap}
  .status-pill{display:inline-block;padding:3px 9px;border-radius:999px;
               font-size:12px;font-weight:600;white-space:nowrap}
  .status-pending{background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted)}
  .status-processing{background:var(--brand-soft);color:var(--brand)}
  .status-done{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
  .status-error{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
  .prog{--p:0;width:46px;height:46px;border-radius:50%;flex:none;
        background:conic-gradient(var(--brand) calc(var(--p)*1%), var(--border) 0);
        display:flex;align-items:center;justify-content:center;transition:background .25s}
  .prog span{width:36px;height:36px;border-radius:50%;background:var(--card);
             display:flex;align-items:center;justify-content:center;
             font-size:11px;font-weight:700;color:var(--text)}
  .prog.err{background:conic-gradient(var(--err) calc(var(--p)*1%), var(--border) 0)}
  .file-error{display:block;font-size:11.5px;color:var(--err);margin-top:2px;font-weight:400}
  .file-note{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
  .btn-row{font-size:12.5px;padding:7px 12px;border-radius:8px;white-space:nowrap}
  .btn-row-dl{background:var(--green);color:#fff}
  .btn-row-dl:hover:not(:disabled){background:var(--green-h)}
  .btn-row-del{background:transparent;color:var(--err);border:1px solid var(--border);margin-left:6px}
  .btn-row-del:hover:not(:disabled){border-color:var(--err)}

  .hidden{display:none!important}

  .login-actions{display:flex;justify-content:flex-end;margin-top:14px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;padding:11px 13px;font:inherit;
        border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}
  input:focus{outline:none;border-color:var(--brand);
              box-shadow:0 0 0 3px var(--brand-soft)}

  .preview{margin-top:14px}
  .preview-toggle{background:transparent;border:none;color:var(--brand);font-weight:600;
                  font-size:13.5px;cursor:pointer;padding:6px 0}
  .preview-toggle:hover{text-decoration:underline}
  .preview-body{margin-top:8px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;border-radius:8px;overflow:hidden}
  td,th{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:color-mix(in srgb,var(--muted) 10%,transparent);font-weight:600}
  pre{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--muted) 8%,transparent);
      padding:12px;border-radius:8px;max-height:340px;overflow:auto;font-size:12.5px;margin:0}

  footer{margin-top:auto;padding:28px 0 8px;font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<main>
  <div class="brand">Эксойл Групп</div>
  <h1>Обезличивание документов</h1>

  <!-- Вход -->
  <section id="loginBox" class="card">
    <label class="field"><span>Логин</span>
      <input id="login" type="text" autocomplete="username">
    </label>
    <label class="field"><span>Пароль</span>
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <div id="loginMsg" class="status err"></div>
    <div class="login-actions">
      <button id="loginBtn" class="btn-primary">Войти</button>
    </div>
  </section>

  <!-- Приложение -->
  <section id="app" class="hidden">

    <!-- Шаг 1: загрузка -->
    <div class="card">
      <div class="step"><span class="num">1</span>Загрузить файлы</div>

      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Выбрать файлы">
        <div class="title">Выберите файлы или перетащите сюда</div>
        <div class="hint">PDF, Word (.docx), Excel (.xlsx) — можно несколько файлов сразу</div>
        <div id="fname" class="fname hidden"></div>
        <input id="file" type="file" accept=".pdf,.docx,.xlsx" multiple class="hidden">
      </div>

      <div class="row">
        <button id="btn" class="btn-primary grow" disabled>Обработать все</button>
        <button id="logout" class="link-btn" type="button">Выйти</button>
      </div>

      <div id="status" class="status" style="margin-top:10px"></div>
    </div>

    <!-- Шаг 2: таблица файлов и скачивание по мере готовности -->
    <div id="result" class="card hidden">
      <div class="step"><span class="num">2</span>Файлы</div>

      <div style="overflow-x:auto">
        <table class="files-table">
          <thead>
            <tr>
              <th>Файл</th>
              <th>Размер</th>
              <th>Статус</th>
              <th>Прогресс</th>
              <th>Время</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="filesBody"></tbody>
        </table>
      </div>

      <div id="summary" class="status" style="margin-top:10px"></div>

      <div class="preview">
        <button id="previewToggle" class="preview-toggle hidden" type="button">Показать предпросмотр последнего файла</button>
        <div id="previewBody" class="preview-body hidden"></div>
      </div>
    </div>

  </section>
</main>

<footer>Разработано Жданкиным А.А.</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);

let creds = null;
try { creds = JSON.parse(sessionStorage.getItem("creds") || "null"); } catch { creds = null; }

function headers() { return creds ? { "X-Login": creds.login, "X-Password": creds.password } : {}; }

function showLogin() {
  $("app").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
}
function showApp() {
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
}
function logout() {
  creds = null;
  sessionStorage.removeItem("creds");
  showLogin();
  resetUpload();
}
function resetUpload() {
  processing = false;
  queue = [];
  clearQueueStorage();
  $("file").value = "";
  $("filesBody").textContent = "";
  $("fname").classList.add("hidden");
  $("fname").textContent = "";
  $("drop").classList.remove("has-file");
  $("btn").disabled = true;
  $("result").classList.add("hidden");
  $("summary").textContent = "";
  $("previewBody").textContent = "";
  $("previewBody").classList.add("hidden");
  $("previewToggle").classList.add("hidden");
  setStatus("", "");
}

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text || "";
  el.className = "status" + (kind ? " " + kind : "");
}

async function login() {
  const login = $("login").value.trim();
  const password = $("password").value;
  if (!login || !password) { $("loginMsg").textContent = "Введите логин и пароль"; return; }
  $("loginBtn").disabled = true;
  $("loginMsg").textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login, password })
    });
    let d = {};
    try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.detail || "Неверный логин или пароль");
    creds = { login, password };
    sessionStorage.setItem("creds", JSON.stringify(creds));
    $("password").value = "";
    showApp();
    restoreQueue();
  } catch (e) {
    $("loginMsg").textContent = e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
}

$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("login").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("logout").addEventListener("click", logout);

// ---------- выбор файлов и сохранение состояния ----------
let queue = [];
let processing = false;
let nextFileId = 1;
let restoring = false;

// Состояние очереди (включая сами файлы) храним в IndexedDB. Благодаря этому
// перезагрузка страницы не теряет ни прогресс, ни ещё не отправленные файлы.
const DB_NAME = "pii_masker_state";
const DB_STORE = "items";
const DB_VERSION = 1;
let dbPromise = null;

function openDB() {
  if (!("indexedDB" in window)) return Promise.resolve(null);
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(resolve => {
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE))
          db.createObjectStore(DB_STORE, { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch {
      resolve(null);
    }
  });
  return dbPromise;
}

async function idbGetAll() {
  const db = await openDB();
  if (!db) return [];
  return new Promise(resolve => {
    try {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    } catch {
      resolve([]);
    }
  });
}

function itemSnapshot(item) {
  return {
    id: item.id,
    name: item.name,
    size: item.size,
    lastModified: item.lastModified,
    blob: item.blob || null,
    status: item.status,
    stage: item.stage || "",
    jobId: item.jobId || "",
    pct: item.pct || 0,
    elapsed: item.elapsed,
    error: item.error || "",
    note: item.note || "",
    downloadUrl: item.downloadUrl || "",
    downloadName: item.downloadName || "",
    previewType: item.previewType || "",
    preview: item.preview || null,
    createdAt: item.createdAt || Date.now()
  };
}

async function saveItem(item) {
  const db = await openDB();
  if (!db) return;
  try {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(itemSnapshot(item));
  } catch {}
}

async function idbDelete(id) {
  const db = await openDB();
  if (!db) return;
  try {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(id);
  } catch {}
}

async function clearQueueStorage() {
  const db = await openDB();
  if (!db) return;
  try {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).clear();
  } catch {}
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

function pickFiles() { $("file").click(); }
$("drop").addEventListener("click", pickFiles);
$("drop").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFiles(); }
});
["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.add("over");
}));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.remove("over");
}));
$("drop").addEventListener("drop", e => addFiles(e.dataTransfer.files));
$("file").addEventListener("change", e => {
  addFiles(e.target.files);
  e.target.value = "";
});

function formatSize(bytes) {
  if (bytes == null) return "—";
  if (bytes < 1024) return bytes + " Б";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " КБ";
  return (bytes / (1024 * 1024)).toFixed(1) + " МБ";
}

function createRow(item) {
  const tr = document.createElement("tr");

  const nameTd = document.createElement("td");
  nameTd.className = "fname";
  nameTd.textContent = item.name || (item.file && item.file.name) || "документ";

  const sizeTd = document.createElement("td");
  sizeTd.className = "muted";
  sizeTd.textContent = formatSize(item.size != null ? item.size
                                                   : (item.file ? item.file.size : null));

  const statusTd = document.createElement("td");
  const progressTd = document.createElement("td");
  progressTd.innerHTML = '<div class="prog"><span>0%</span></div>';
  const timeTd = document.createElement("td");
  timeTd.className = "muted";
  const actionTd = document.createElement("td");

  tr.appendChild(nameTd);
  tr.appendChild(sizeTd);
  tr.appendChild(statusTd);
  tr.appendChild(progressTd);
  tr.appendChild(timeTd);
  tr.appendChild(actionTd);
  $("filesBody").appendChild(tr);

  if (item.pct == null) item.pct = 0;
  item.els = { status: statusTd, progress: progressTd, time: timeTd, action: actionTd };
  return tr;
}

function addFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (restoring) {
    // Дождёмся восстановления очереди, иначе восстановление перезапишет
    // только что добавленные файлы.
    setTimeout(() => addFiles(files), 150);
    return;
  }

  const skipped = [];
  let added = 0;
  for (const f of files) {
    const name = (f.name || "").toLowerCase();
    const allowed = [".pdf", ".docx", ".xlsx"];
    if (!allowed.some(ext => name.endsWith(ext))) { skipped.push(f.name); continue; }
    const sameFile = q => (q.name || (q.file && q.file.name)) === f.name &&
                          q.size === f.size && q.lastModified === f.lastModified;
    // Повторно отправлять можно только файл, который уже не в работе.
    // Обработанную или упавшую строку убираем, иначе проверка дублей
    // блокирует повторную загрузку того же документа.
    if (queue.some(q => sameFile(q) && q.status !== "done" && q.status !== "error")) continue;
    const stale = queue.filter(q => sameFile(q) && (q.status === "done" || q.status === "error"));
    if (stale.length) {
      for (const old of stale) {
        if (old.els && old.els.status) {
          const tr = old.els.status.closest("tr");
          if (tr) tr.remove();
        }
        idbDelete(old.id);
      }
      queue = queue.filter(q => !stale.includes(q));
    }
    const item = {
      id: nextFileId++,
      name: f.name,
      size: f.size,
      lastModified: f.lastModified,
      blob: f,
      file: f,
      status: "pending",
      stage: "",
      jobId: "",
      pct: 0,
      elapsed: null,
      error: "",
      note: "",
      downloadUrl: "",
      downloadName: "",
      previewType: "",
      preview: null,
      createdAt: Date.now()
    };
    createRow(item);
    queue.push(item);
    updateRow(item);
    saveItem(item);
    added++;
  }

  if (skipped.length) {
    setStatus("Пропущены (нужен PDF, DOCX или XLSX): " + skipped.join(", "), "err");
  } else if (added) {
    setStatus("", "");
  }

  updateSelectedInfo();
  if (queue.length) $("result").classList.remove("hidden");
  updateSummary();
  updateButton();
}

function updateSelectedInfo() {
  // В поле выбора показываем только файлы, которые ещё не отправлены:
  // после запуска обработки оно очищается, и можно добавить новый документ.
  const ready = queue.filter(q => q.status === "pending" || q.status === "uploading");
  const n = ready.length;
  if (!n) {
    $("fname").textContent = "";
    $("fname").classList.add("hidden");
    $("drop").classList.remove("has-file");
    return;
  }
  $("fname").textContent = n === 1 ? (ready[0].name || (ready[0].file ? ready[0].file.name : ""))
                                  : "Выбрано файлов: " + n;
  $("fname").classList.remove("hidden");
  $("drop").classList.add("has-file");
}

function renderProgress(item, pct) {
  if (!item.els) return;
  const el = item.els.progress.firstChild;
  const p = Math.max(0, Math.min(100, Math.round(pct || 0)));
  item.pct = p;
  el.style.setProperty("--p", p);
  el.firstChild.textContent = p + "%";
  el.classList.toggle("err", item.status === "error");
}

function isActiveStatus(status) {
  return status === "uploading" || status === "queued" || status === "processing";
}

function updateRow(item) {
  if (!item.els) return;
  const labels = {
    pending: ["В очереди", "status-pending"],
    uploading: ["Загрузка…", "status-processing"],
    queued: ["В очереди", "status-pending"],
    processing: ["Обработка…", "status-processing"],
    done: ["Готово", "status-done"],
    error: ["Ошибка", "status-error"]
  };
  const [label, cls] = labels[item.status] || labels.pending;
  const statusTd = item.els.status;
  statusTd.textContent = "";
  const pill = document.createElement("span");
  pill.className = "status-pill " + cls;
  pill.textContent = label;
  statusTd.appendChild(pill);

  const noteText = item.error
    ? ""
    : (item.note || (isActiveStatus(item.status) && item.stage ? item.stage : ""));
  if (item.error) {
    const err = document.createElement("span");
    err.className = "file-error";
    err.textContent = item.error;
    statusTd.appendChild(err);
  } else if (noteText) {
    const note = document.createElement("span");
    note.className = "file-note";
    note.textContent = noteText;
    statusTd.appendChild(note);
  }

  item.els.time.textContent = item.elapsed != null ? item.elapsed + " с" : "—";

  // Показываем только реальный прогресс с сервера, без искусственного роста.
  renderProgress(item, item.status === "done" ? 100 : (item.pct || 0));

  const actionTd = item.els.action;
  actionTd.textContent = "";
  const btn = document.createElement("button");
  btn.className = "btn-row";
  btn.type = "button";
  if (item.status === "done" && item.downloadUrl) {
    btn.classList.add("btn-row-dl");
    btn.textContent = "Скачать";
    btn.addEventListener("click", () => downloadFile(item.downloadUrl, item.downloadName));
  } else {
    btn.textContent = isActiveStatus(item.status) ? "Подождите" : "Скачать";
    btn.disabled = true;
  }
  actionTd.appendChild(btn);
  // Пока файл не в работе, его можно убрать из списка: например, если
  // случайно добавили не тот документ.
  if (!isActiveStatus(item.status)) {
    const del = document.createElement("button");
    del.className = "btn-row btn-row-del";
    del.type = "button";
    del.textContent = "Удалить";
    del.addEventListener("click", () => removeItem(item));
    actionTd.appendChild(del);
  }
}

function removeItem(item) {
  if (isActiveStatus(item.status)) return;
  if (item.els && item.els.status) {
    const tr = item.els.status.closest("tr");
    if (tr) tr.remove();
  }
  idbDelete(item.id);
  queue = queue.filter(q => q !== item);
  updateSelectedInfo();
  updateSummary();
  updateButton();
  if (!queue.length) $("result").classList.add("hidden");
}

function updateSummary() {
  const total = queue.length;
  if (!total) { $("summary").textContent = ""; return; }
  const done = queue.filter(q => q.status === "done").length;
  const errors = queue.filter(q => q.status === "error").length;
  const active = queue.filter(q => isActiveStatus(q.status)).length;
  let text = "Готово " + done + " из " + total;
  if (errors) text += ", с ошибкой: " + errors;
  if (active) text += " — идёт обработка…";
  $("summary").textContent = text;
}

function updateButton() {
  $("btn").disabled = processing || !queue.some(q => q.status === "pending" ||
                                                     q.status === "uploading");
}

// ---------- обработка: серверная очередь + реальный прогресс ----------
$("btn").addEventListener("click", processAll);

function finishStatus() {
  const errors = queue.filter(q => q.status === "error").length;
  setStatus(errors ? "Обработка завершена, ошибок: " + errors
                   : "Все файлы готовы. Скачивайте по одному.",
            errors ? "err" : "ok");
}

async function uploadPending() {
  for (const item of queue) {
    if (!creds) return;
    if (item.jobId) continue;
    if (item.status === "done" || item.status === "error") continue;
    const blob = item.blob || item.file;
    if (!blob) {
      item.status = "error";
      item.error = "Файл недоступен после перезагрузки — добавьте его снова";
      item.pct = 0;
      saveItem(item);
      updateRow(item);
      continue;
    }
    item.status = "uploading";
    item.stage = "Отправка на сервер";
    item.pct = 0;
    item.error = "";
    item.note = "";
    item.elapsed = null;
    updateRow(item);
    updateSummary();
    await saveItem(item);
    try {
      const fd = new FormData();
      fd.append("file", blob, item.name || blob.name || "document");
      const r = await fetch("/api/process", {
        method: "POST", headers: headers(), body: fd
      });
      let d = {};
      try { d = await r.json(); } catch {}
      if (r.status === 401) {
        logout();
        $("loginMsg").textContent = "Сессия истекла, войдите снова";
        return;
      }
      if (!r.ok) throw new Error(d.detail || "Не удалось отправить файл");
      item.jobId = d.job_id || "";
      item.status = "queued";
      item.stage = "В очереди";
      item.pct = 0;
      // Сервер уже принял файл и хранит задание. Сам файл больше не нужен:
      // не переписываем большой blob в IndexedDB на каждом шаге прогресса.
      item.blob = null;
      item.file = null;
      await saveItem(item);
    } catch (e) {
      item.status = "error";
      item.error = e.message;
      item.pct = 0;
      await saveItem(item);
    }
    updateRow(item);
    updateSummary();
  }
}

async function applyJob(item, job) {
  const prevStatus = item.status;
  item.status = job.status || item.status;
  item.pct = job.progress != null ? job.progress : (item.pct || 0);
  item.stage = job.stage || "";
  item.elapsed = job.elapsed != null ? job.elapsed : item.elapsed;

  if (item.status === "done") {
    item.pct = 100;
    item.downloadUrl = job.download_url || item.downloadUrl;
    item.downloadName = job.download_name || item.downloadName || ("masked_" + item.name);
    item.note = job.warning || (job.llm_error
      ? "LLM вернула ошибку на части фрагментов"
      : "");
    item.previewType = job.preview_type || "";
    item.preview = job.preview != null ? job.preview : null;
    item.blob = null;
    item.file = null;
    renderPreview(job, item.name);
  } else if (item.status === "error") {
    item.error = job.error || "Не удалось обработать файл";
    item.pct = 0;
  } else {
    item.error = "";
  }

  if (prevStatus !== item.status || isActiveStatus(item.status))
    await saveItem(item);
}

async function pollUntilDone() {
  while (processing && creds) {
    const active = queue.filter(q => q.jobId && isActiveStatus(q.status));
    if (!active.length) break;
    try {
      const r = await fetch("/api/jobs", { headers: headers() });
      if (r.status === 401) {
        logout();
        $("loginMsg").textContent = "Сессия истекла, войдите снова";
        return;
      }
      if (r.ok) {
        const d = await r.json();
        const byId = new Map((d.jobs || []).map(j => [j.id, j]));
        for (const item of queue) {
          if (!item.jobId) continue;
          if (item.status === "done" || item.status === "error") continue;
          const job = byId.get(item.jobId);
          if (!job) {
            item.missing = (item.missing || 0) + 1;
            if (item.missing >= 3) {
              item.status = "error";
              item.error = "Задание не найдено на сервере (возможно, сервер перезапущен)";
              item.pct = 0;
              saveItem(item);
              updateRow(item);
            }
            continue;
          }
          item.missing = 0;
          await applyJob(item, job);
          updateRow(item);
        }
      }
    } catch {}
    updateSummary();
    if (!queue.some(q => q.jobId && isActiveStatus(q.status))) break;
    await sleep(900);
  }
}

async function processAll() {
  if (processing) return;
  if (!creds) { logout(); return; }
  if (!queue.some(q => q.status === "pending" || q.status === "uploading")) {
    setStatus("Добавьте файлы для обработки", "err");
    return;
  }

  processing = true;
  $("btn").disabled = true;
  setStatus("Файлы обрабатываются, ожидайте....", "");

  try {
    await uploadPending();
    await pollUntilDone();
  } finally {
    // Снимаем блокировку при любом сбое, иначе кнопка останется недоступной
    // и новые файлы нельзя будет отправить без перезагрузки страницы.
    processing = false;
    updateButton();
    updateSummary();
    updateSelectedInfo();
  }
  if (!creds) return;
  finishStatus();
}

async function restoreQueue() {
  if (restoring) return;
  restoring = true;
  try {
    const saved = await idbGetAll();
    if (!saved.length) return;
    queue = saved.map(raw => {
      const blob = raw.blob || null;
      return {
        ...raw,
        blob,
        file: blob ? new File([blob], raw.name || "document", {
          type: blob.type || "", lastModified: raw.lastModified || Date.now()
        }) : null,
        els: null,
        pct: raw.pct || 0,
        missing: 0
      };
    }).sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));

    nextFileId = Math.max(0, ...queue.map(q => Number(q.id) || 0)) + 1;
    $("filesBody").textContent = "";
    for (const item of queue) {
      createRow(item);
      updateRow(item);
    }
    updateSelectedInfo();
    $("result").classList.remove("hidden");
    updateSummary();
    updateButton();

    const lastDone = [...queue].reverse().find(q => q.status === "done" && q.preview != null);
    if (lastDone)
      renderPreview({ preview_type: lastDone.previewType, preview: lastDone.preview },
                    lastDone.name);

    // Прерванная загрузка (страницу перезагрузили посреди отправки) — это
    // незавершённая обработка, её продолжаем сами. Просто добавленные, но так и
    // не запущенные файлы не отправляем: пользователь сам нажмёт «Обработать».
    const interrupted = queue.some(q => !q.jobId && q.status === "uploading");
    const hasActive = queue.some(q => q.jobId && isActiveStatus(q.status));
    if (interrupted || hasActive) {
      processing = true;
      $("btn").disabled = true;
      setStatus("Восстанавливаю обработку…", "");
      try {
        await uploadPending();
        await pollUntilDone();
      } finally {
        processing = false;
        updateButton();
        updateSummary();
      }
      if (creds) finishStatus();
    }
  } finally {
    restoring = false;
  }
}

async function downloadFile(url, name) {
  try {
    const r = await fetch(url, { headers: headers() });
    if (r.status === 401) { logout(); $("loginMsg").textContent = "Сессия истекла"; return; }
    if (!r.ok) throw new Error("Не удалось скачать файл");
    const blob = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objUrl;
    a.download = name || "masked";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 2000);
  } catch (e) {
    setStatus("Ошибка скачивания: " + e.message, "err");
  }
}

// ---------- предпросмотр последнего готового файла ----------
function renderPreview(d, filename) {
  const body = $("previewBody");
  const toggle = $("previewToggle");
  body.textContent = "";
  body.classList.add("hidden");
  toggle.classList.remove("hidden");
  toggle.textContent = "Показать предпросмотр" + (filename ? ": " + filename : "");

  if (d.preview_type === "excel" && Array.isArray(d.preview) && d.preview.length) {
    const t = document.createElement("table");
    d.preview.forEach((row, i) => {
      const tr = document.createElement("tr");
      (row || []).forEach(c => {
        const el = document.createElement(i === 0 ? "th" : "td");
        el.textContent = c == null ? "" : String(c);
        tr.appendChild(el);
      });
      t.appendChild(tr);
    });
    body.appendChild(t);
  } else {
    const pre = document.createElement("pre");
    pre.textContent = d.preview || "(текст не извлечён)";
    body.appendChild(pre);
  }

  toggle.onclick = () => {
    const hidden = body.classList.toggle("hidden");
    toggle.textContent = hidden
      ? "Показать предпросмотр" + (filename ? ": " + filename : "")
      : "Скрыть предпросмотр";
  };
}

// ---------- старт ----------
if (creds) {
  fetch("/api/me", { headers: headers() })
    .then(r => { if (r.ok) { showApp(); restoreQueue(); } else logout(); })
    .catch(() => logout());
} else {
  showLogin();
}
</script>
